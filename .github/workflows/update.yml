name: Update Florida Turnout Data

on:
  schedule:
    # 7:15 AM – 7:15 PM EDT (11:15–23:15 UTC)
    - cron: "15 11-23 * * *"

    # 8:15 PM – 9:15 PM EDT (00:15–01:15 UTC)
    - cron: "15 0-1 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Python script
        run: |
          python County_Results.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .

          git status

          git commit -m "Automatic turnout update" || echo "No changes to commit"

          git pull --rebase origin main

          git push
